<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;width:100%;overflow-x:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#f0f2f5;color:#1a1a1a;font-size:13px;-webkit-text-size-adjust:100%}

/* ── INPUTS ── */
input,select{font-family:inherit;font-size:12px;border:1px solid #ddd;border-radius:7px;padding:7px 9px;width:100%;outline:none;background:#fff}
input:focus,select:focus{border-color:#1a6b3c;box-shadow:0 0 0 2px #1a6b3c18}

/* ── LAYOUT ── */
#app{width:100%;min-height:100vh;display:flex;flex-direction:column}

/* ── TOPBAR ── */
.topbar{color:#fff;padding:10px 16px;border-radius:0;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;flex-shrink:0;width:100%;min-height:52px}

/* ── MAIN PANEL ── */
.panel{background:#fff;flex:1;min-height:0;padding:12px 16px;border-top:1px solid #eee;overflow:hidden;display:flex;flex-direction:column}

/* ── OVERLAY ── */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;align-items:center;justify-content:center}
.overlay.show{display:flex}
.obox{background:#fff;border-radius:14px;padding:1.6rem;width:min(300px,90vw);text-align:center;box-shadow:0 8px 32px #0003}

/* ── LOGIN ── */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f6e3a18,#4B3FC710);padding:16px;box-sizing:border-box}
.login-card{background:#fff;border-radius:16px;padding:2rem;width:100%;max-width:420px;box-shadow:0 4px 24px #0002}
.rbtn{width:100%;padding:12px 14px;border:1px solid #e8e8e8;border-radius:10px;background:#fff;display:flex;align-items:center;gap:11px;margin-bottom:8px;text-align:left;cursor:pointer;transition:all .15s}
.rbtn:hover{background:#f6faf8;border-color:#1a6b3c44}

/* ── PIN PAD ── */
.pdots{display:flex;justify-content:center;gap:10px;margin:16px 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #ddd;transition:all .15s}
.dot.on{background:#1a6b3c;border-color:#1a6b3c}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:200px;margin:0 auto}
.pkey{padding:14px;border:1px solid #e8e8e8;border-radius:9px;background:#f8f8f8;font-size:18px;font-weight:600;cursor:pointer;touch-action:manipulation}
.pkey:hover,.pkey:active{background:#eee}
.pkey.del{color:#c0392b}
.perr{color:#c0392b;font-size:11px;margin-top:8px;min-height:18px}

/* ── TABS ── */
.tabs{display:flex;border-bottom:2px solid #eee;margin-bottom:10px;overflow-x:auto;scrollbar-width:none;gap:0;flex-shrink:0;min-height:38px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border:none;background:none;cursor:pointer;font-size:12px;color:#888;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;font-weight:500;transition:all .15s;touch-action:manipulation}
.tab:hover{color:#444}
.tab.on{color:#1a6b3c;border-bottom-color:#1a6b3c;font-weight:700}

/* ── KPI CARDS ── */
.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.mc{border-radius:10px;padding:13px 14px}
.lbl{font-size:10px;color:#888;margin-bottom:5px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.val{font-size:18px;font-weight:700}
.sub{font-size:10px;color:#999;margin-top:3px}

/* ── TABLES ── */
.tw{border:1px solid #eee;border-radius:10px;overflow:auto;width:100%;flex:1;min-height:0}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;font-size:10px;color:#666;border-bottom:2px solid #eee;position:sticky;top:0;background:#fafafa;white-space:nowrap;font-weight:700;text-transform:uppercase;letter-spacing:.2px;z-index:2}
td{padding:8px 10px;border-bottom:1px solid #f5f5f5;white-space:nowrap;vertical-align:middle}
tr:hover td{background:#f8fffe}
tr:last-child td{border-bottom:none}

/* ── BADGES ── */
.bd{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700}
.pos{color:#0f6e3a;font-weight:700}
.neg{color:#c0392b;font-weight:700}
.mu{color:#aaa}

/* ── FORMS ── */
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.fl{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.fl label{font-size:10px;color:#888;font-weight:700;text-transform:uppercase;letter-spacing:.3px}
.sec{background:#f8f8f8;border-radius:10px;padding:14px;margin-bottom:12px}
.sec-title{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;letter-spacing:.4px;margin-bottom:10px}

/* ── BUTTONS ── */
.btn-main{padding:11px 16px;border-radius:9px;border:none;font-weight:700;font-size:13px;cursor:pointer;width:100%;touch-action:manipulation}
.btn-green{background:#1a6b3c;color:#fff}
.btn-blue{background:#0a3d7c;color:#fff}
.btn-gray{background:#f0f0f0;color:#333;border:1px solid #ddd}
.del-btn{background:#fdecea;border:1px solid #f5c0b8;color:#c0392b;padding:4px 9px;border-radius:6px;cursor:pointer;font-size:10px;touch-action:manipulation}
.edit-btn{background:#DDEEFF;border:1px solid #a0c4ee;color:#0a3d7c;padding:4px 9px;border-radius:6px;cursor:pointer;font-size:10px;touch-action:manipulation}

/* ── STEP BOXES ── */
.step-box{border-radius:9px;padding:10px 13px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.result-box{border-radius:11px;padding:14px 16px;margin:12px 0;border:2px solid #e0e0e0;background:#f8f8f8}
.result-box.gain{background:#D6F5E3;border-color:#1a6b3c}

/* ── OTHER PANELS ── */
.aside-panel{background:#FFFBEA;border:1.5px solid #F5C518;border-radius:11px;padding:14px;margin-bottom:14px}
.fin-banner{background:linear-gradient(135deg,#0f6e3a,#1a9e55);border-radius:12px;padding:14px 16px;margin-bottom:14px;color:#fff}
.split-banner{background:linear-gradient(135deg,#0a3d7c,#1a6bbf);border-radius:12px;padding:16px;margin-bottom:16px;color:#fff}
.socio-card{background:rgba(255,255,255,.18);border-radius:10px;padding:12px 16px;text-align:center;border:1.5px solid rgba(255,255,255,.3)}
.bar-chart{display:flex;align-items:flex-end;gap:4px;height:65px;margin-top:4px}
.srow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.srow input{flex:1;min-width:180px}
.badge-vzla{background:#CF0001;color:#fff;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.badge-brl{background:#009C3B;color:#fff;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap}
.gc{background:#D6F5E3;color:#0b4d27;font-weight:700;text-align:right}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.ccard{background:#fff;border:1px solid #e8e8e8;border-radius:10px;padding:12px;transition:all .15s}
.ccard:hover{border-color:#1a6b3c;box-shadow:0 2px 8px #1a6b3c18}

/* ══════════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
══════════════════════════════════════════════ */

/* ── Mobile (≤600px) ── */
@media (max-width:600px){
  .topbar{padding:8px 12px;gap:6px}
  .topbar .sub-info{font-size:10px;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .panel{padding:8px 10px}
  .tab{padding:7px 10px;font-size:11px}
  .f2,.f3{grid-template-columns:1fr !important}
  .mg{grid-template-columns:1fr 1fr !important}
  .client-grid{grid-template-columns:1fr 1fr !important}
  .step-box{flex-direction:column;align-items:flex-start}
  .login-card{padding:1.2rem;border-radius:12px;max-width:100%}
  .btn-main{padding:13px;font-size:14px}
  th{font-size:9px;padding:6px 7px}
  td{font-size:11px;padding:6px 7px}
  .sec{padding:10px}
  input,select{font-size:14px;padding:9px 10px}
  .srow{flex-direction:column;align-items:stretch}
  .srow input{min-width:100%}
  .srow span{text-align:right}
}

/* ── Tablet (601px–1024px) ── */
@media (min-width:601px) and (max-width:1024px){
  .f3{grid-template-columns:1fr 1fr !important}
  .mg{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
  .panel{padding:12px 14px}
  th{font-size:10px;padding:7px 9px}
  td{font-size:12px;padding:7px 9px}
}

/* ── Desktop (1025px–1599px) ── */
@media (min-width:1025px){
  .panel{padding:14px 18px}
  .tab{font-size:12px;padding:9px 15px}
  th{font-size:11px;padding:9px 10px}
  td{font-size:12px;padding:8px 10px}
}

/* ── Large desktop (≥1600px) ── */
@media (min-width:1600px){
  .topbar{padding:12px 24px}
  .panel{padding:16px 24px}
  table{font-size:13px}
  th{font-size:12px;padding:10px 12px}
  td{padding:10px 12px}
  .tab{font-size:13px;padding:10px 18px}
  .val{font-size:20px}
  .mg{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}
  input,select{font-size:13px;padding:8px 11px}
  .btn-main{font-size:14px;padding:12px 18px}
}

/* ── Ultra-wide (≥2200px) ── */
@media (min-width:2200px){
  table{font-size:14px}
  th{font-size:13px;padding:12px 14px}
  td{padding:11px 14px}
  .topbar{padding:14px 32px}
  .panel{padding:18px 32px}
  .tab{font-size:14px;padding:12px 22px}
}

/* ── Print ── */
@media print{
  .topbar,.tabs,.btn-main,.del-btn,.edit-btn{display:none!important}
  .panel{border:none;box-shadow:none;padding:0}
  .tw{overflow:visible;max-height:none}
  table{font-size:10px}
  th,td{padding:4px 6px}
}

function td(){return new Date().toISOString().split("T")[0];}
function r4(n){ // Round to max 4 significant decimals, no floating point artifacts
  var v=parseFloat(n)||0;
  return Math.round(v*10000)/10000;
}
function f2(n){return r4(n).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:2});}
function f4(n){return r4(n).toLocaleString("es-VE",{minimumFractionDigits:2,maximumFractionDigits:4});}
function f0(n){return r4(n).toLocaleString("es-VE",{minimumFractionDigits:0,maximumFractionDigits:0});}
function ds(s){
  // Parse ISO date (yyyy-mm-dd) → dd/mm/yy
  if(!s) return "";
  var parts=s.split("-");
  if(parts.length===3){
    var yy=parts[0].slice(-2);
    return parts[2].padStart(2,"0")+"/"+parts[1].padStart(2,"0")+"/"+yy;
  }
  return s;
}
function dFmt(d){
  // Display any date string as dd/mm/yy
  if(!d) return "";
  // Already dd/mm/yy
  if(/^\d{2}\/\d{2}\/\d{2}$/.test(d)) return d;
  // dd/mm without year → add /26
  if(/^\d{2}\/\d{2}$/.test(d)) return d+"/26";
  // ISO format
  return ds(d);
}

function tEgPend(){return S.egresos.filter(function(e){return !e.pagada;}).reduce(function(a,e){return a+e.usdt;},0);}

function cTx(){
  var f=S.tx,am=parseFloat(f.am)||0,td2=parseFloat(f.tdia)||0;
  var ruta=RUTAS.find(function(r){return r.rt===f.rt;})||RUTAS[0];
  // VZLA ↔ BRL: cliente entrega BS, tasa = BRL × 1000 BS
  // → cant (BRL) = am (BS) / tdia * 1000... pero tdia = BRL×1000BS
  // → cant = am * tdia / 1000  ← división: 138000 BS ÷ 160 = 862.5 BRL... no
  // Según usuario: 138000 BS, tasa 160 (BS×1BRL=160), cant = 138000/160 = 862.5 BRL
  // PERO lDia dice "BRL × 1000 BS" = cuántos BRL por cada 1000 BS
  // entonces cant = am / 1000 * tdia ← si tdia=0.16, cant=138000/1000*0.16=22.08
  // Revisando historial VZLA: am=5.3, tdia=145, cant=37 → 5300/145=36.55≈37 ✓
  // ENTONCES: am es en miles de VES (o VES directo), cant = am/tdia
  // am=5.3 (miles BS?), cant=37 BRL: 5300/145=36.55 ✓ → am en BS directos, cant=am/tdia
  var isVzla = ruta && ruta.orig==="VES";
  var cant = isVzla ? (td2>0 ? r4(am/td2) : 0) : am*td2;
  var rates = getAutoRates(ruta.orig, ruta.dest||"VES");
  var tc=parseFloat(f.tc_manual)||rates.tc||parseFloat(f.tc)||0;
  var tv=parseFloat(f.tv_manual)||rates.tv||parseFloat(f.tv)||0;
  var com=COM();
  if(!tc||!tv) return{am:am,tdia:td2,cant:cant,tc:tc,uc:0,tv:tv,uv:0,pr:0,com:com};
  var uc_r = isVzla ? (am/tc - com) : (am/tc - com);
  var uv_r = isVzla ? (cant/tv + com) : (am*td2)/tv + com;
  var uc = r4(uc_r);
  var uv = r4(uv_r);
  var pr = r4(uc_r - uv_r);
  return{am:am,tdia:td2,cant:cant,tc:tc,uc:uc,tv:tv,uv:uv,pr:pr,com:com};
}
function cTxE(){
  var f=S.txE,am=parseFloat(f.am)||0,td2=parseFloat(f.tdia)||0;
  var rates=getAutoRates("USD","VES");
  var tc=parseFloat(f.tc_manual)||rates.tc||parseFloat(f.tc)||0;
  var tv=parseFloat(f.tv_manual)||rates.tv||parseFloat(f.tv)||0;
  var com=COM();
  if(!tc||!tv) return{am:am,tdia:td2,cant:am*td2,tc:tc,uc:0,tv:tv,uv:0,pr:0,com:com};
  var uc_r = am/tc - com;
  var uv_r = (am*td2)/tv + com;
  var uc = r4(uc_r);
  var uv = r4(uv_r);
  var pr = r4(uc_r - uv_r);
  return{am:am,tdia:td2,cant:am*td2,tc:tc,uc:uc,tv:tv,uv:uv,pr:pr,com:com};
}

function ejecutarCierreMes(mesKey, manual){
  if(!S.cierresMes) S.cierresMes=[];
  var partsK = mesKey.split("-");
  var brlM   = filterByMes(S.brl,   mesKey);
  var vzlaM  = filterByMes(S.vzla,  mesKey);
  var eeuuM  = filterByMes(S.eeuu,  mesKey);
  var egM    = filterByMes(S.egresos, mesKey);
  var invM   = filterByMes(S.inventarioUsdt, mesKey);

  var ganBrl  = brlM.reduce(function(a,r){return a+r.pr;},0);
  var ganVzla = vzlaM.reduce(function(a,r){return a+r.pr;},0);
  var ganEE   = eeuuM.reduce(function(a,r){return a+r.pr;},0);
  var egPag   = egM.filter(function(e){return e.pagada;}).reduce(function(a,e){return a+e.usdt;},0);
  var egPend  = egM.filter(function(e){return !e.pagada;}).reduce(function(a,e){return a+e.usdt;},0);
  var compM   = invM.filter(function(r){return r.tipo==="compra";}).reduce(function(a,r){return a+(parseFloat(r.usdt)||0);},0);
  var ventM   = invM.filter(function(r){return r.tipo==="venta";}).reduce(function(a,r){return a+(parseFloat(r.usdt)||0);},0);
  var usdtDisp= compM - ventM;

  // Snapshot de saldos al cierre
  var saldosCierre = (S.capital||[]).map(function(c){
    return {nombre:c.nombre, moneda:c.moneda, saldo:parseFloat(c.saldo)||0};
  });

  var cierre = {
    mesKey:      mesKey,
    mesLabel:    getMesLabel(partsK[1], partsK[0]),
    fechaCierre: new Date().toISOString(),
    automatico:  !manual,
    ganBrl:      ganBrl,
    ganVzla:     ganVzla,
    ganEE:       ganEE,
    ganJulio:    ganBrl+ganVzla+ganEE*0.5,
    ganPaul:     ganEE*0.5,
    egPag:       egPag,
    egPend:      egPend,

    vzlaOps:     vzlaM.length,
    eeuuOps:     eeuuM.length,
    usdtDisp:    usdtDisp,
    saldosCierre: saldosCierre,
    // Guardar copia de las operaciones del mes
    brl:    brlM,
    vzla:   vzlaM,
    eeuu:   eeuuM,
    egresos: egM
  };

  // Guardar el cierre
  S.cierresMes = S.cierresMes.filter(function(c){return c.mesKey!==mesKey;}); // evitar duplicados
  S.cierresMes.push(cierre);
  S.cierresMes.sort(function(a,b){return b.mesKey.localeCompare(a.mesKey);});
  S.ultimoMesCerrado = mesKey;
  saveData();
  if(manual) { alert("✅ Mes "+cierre.mesLabel+" cerrado y archivado correctamente."); R(); }
}

function saveTraspaso(){
  var f=S.nTraspaso;
  if(!f.fecha||!f.cuentaOrigen||!f.cuentaDestino||!f.monto){alert("Completa todos los campos.");return;}
  var cO=S.cuentas.find(function(c){return c.id===f.cuentaOrigen;});
  var cD=S.cuentas.find(function(c){return c.id===f.cuentaDestino;});
  var monto=parseFloat(f.monto)||0;
  if(!cO||!cD||monto<=0){alert("Datos inválidos.");return;}
  if(cO.moneda!==cD.moneda){alert("Las cuentas deben tener la misma moneda.");return;}
  if(cO.saldo<monto){alert("Saldo insuficiente en "+cO.nombre+" (disponible: "+f2(cO.saldo)+" "+cO.moneda+")");return;}
  // Execute transfer
  cO.saldo=Math.round((cO.saldo-monto)*10000)/10000;
  cD.saldo=Math.round((cD.saldo+monto)*10000)/10000;
  S.traspasos.push({id:Date.now(),fecha:f.fecha,origen:f.cuentaOrigen,destino:f.cuentaDestino,moneda:cO.moneda,monto:monto,nota:f.nota||"",locked:true});
  S.nTraspaso={fecha:f.fecha,cuentaOrigen:"",cuentaDestino:"",monto:"",nota:""};
  saveData();R();
}

function actualizarCuentasPorRemesa(ruta, am, tc, tv, pr, cuentaBancoId, cuentaDestId){
  // Busca cuentas dinámicamente — NUNCA usa IDs hardcodeados
  var amUsdt = (tc&&tc>0) ? Math.round((am/tc)*10000)/10000 : 0;

  function adj(idOrKey, delta, moneda){
    if(!delta) return;
    var c = null;
    if(idOrKey){
      // 1. Buscar por ID exacto
      c = (S.cuentas||[]).find(function(x){return x.id===idOrKey;});
      // 2. Buscar por keyword en nombre con esa moneda
      if(!c && moneda){
        var kw=idOrKey.toLowerCase();
        c=(S.cuentas||[]).find(function(x){return x.activa!==false&&x.moneda===moneda&&x.nombre.toLowerCase().includes(kw);});
      }
    }
    // 3. Primera cuenta activa de esa moneda (fallback final)
    if(!c && moneda){
      c=(S.cuentas||[]).find(function(x){return x.activa!==false&&x.moneda===moneda;});
    }
    if(c) c.saldo=Math.round(((parseFloat(c.saldo)||0)+(parseFloat(delta)||0))*100)/100;
  }

  var cOrigen = cuentaBancoId||"";

  if(ruta==="BRL"||ruta==="BRL ↔ VZLA"){
    adj(cOrigen||"nubank", +am, "BRL");  // Nubank sube (cliente pagó)
    if(cuentaDestId){ var amVes=am*tc; adj(cuentaDestId, -(am*(tv||0)), "VES"); } // VES baja (se entrega)

  }else if(ruta==="VZLA"||ruta==="VZLA ↔ BRL"){
    var amBrl=(tv&&tv>0)?Math.round((amUsdt*tv)*100)/100:0;
    adj(cOrigen||"nubank", -amBrl, "BRL"); // Nubank baja (se entrega BRL)

  }else if(ruta==="EEUU"||ruta.includes("EE.UU")||ruta.includes("UU.EE")){
    adj(cOrigen||"zelle", +am, "USD");  // Zelle sube (cliente pagó)
    if(cuentaDestId){ var amVes2=Math.round(am*(tv||0)*100)/100; adj(cuentaDestId, -amVes2, "VES"); } // VES baja

  }else if(ruta==="USD ↔ BRL"||ruta==="USD→BRL"){
    adj(cOrigen||"zelle", +am, "USD");
    var amBrl2=(tv&&tv>0)?Math.round((amUsdt*tv)*100)/100:0;
    adj("nubank", -amBrl2, "BRL");

  }else if(ruta==="USD ↔ VZLA"||ruta==="USD→VZLA"){
    adj(cOrigen||"zelle", +am, "USD");
    if(cuentaDestId){ adj(cuentaDestId, -Math.round(am*(tv||0)*100)/100, "VES"); }

  }else if(ruta.includes("PEN")){
    if(cOrigen) adj(cOrigen, +am, null);
  }
}

  arr.push({n:nn,d:ds(f.date),id:f.id,cl:f.cl.toUpperCase(),rt:f.rt,am:res.am,orig:ruta.orig,dest:ruta.dest,tdia:res.tdia,cant:res.cant,tc:res.tc,uc:res.uc,pais:f.pais,uv:res.uv,tv:res.tv,total:res.cant,pr:res.pr,cuentaBanco:f.cuentaBanco||"",cuentaDest:f.cuentaDest||"",locked:true});
  arr.sort(function(a,b){var da=a.d.split("/"),db=b.d.split("/");return (parseInt(da[1])*100+parseInt(da[0]))-(parseInt(db[1])*100+parseInt(db[0]))||a.n-b.n;});
  registrarMovimientoCapital({fecha:ds(f.date),rutaOrig:ruta.orig,rutaDest:ruta.dest,amOrigen:res.am,amDestino:res.cant,concepto:f.cl+" · "+f.rt,remesaId:nn});

  consumirInventarioFIFO(ruta.orig,res.uc,ruta.dest==="VES"?"VES":ruta.dest,res.cant);
  // Guardar referencia de tasas para la próxima operación

      id:Date.now(),

      ganancia:res.pr,
      tipo:isV?"vzla":"brl",
      refN:nn,
      estado:"pendiente",
      fechaCobro:""

function pagarPaul(){
  var pin=prompt("🔐 Clave de administrador para confirmar liquidación:");
  if(pin===null) return;
  if(pin!==getEPIN()){alert("Clave incorrecta.");return;}

  // Usar el mes seleccionado en el panel (no el mes actual del sistema)
  var mesKey = (_opMesSel && _opMesSel.length>=6) ? _opMesSel : getMesKeyActual();
  var partsCheck = mesKey.split("-");
  var mesLabelCheck = getMesLabel(partsCheck[1], partsCheck[0]);
  // Validar que el mes tenga operaciones
  var opsCheck = filterByMes(S.eeuu, mesKey);
  if(opsCheck.length === 0){
    alert("No hay operaciones en " + mesLabelCheck + ".\nSelecciona el mes correcto antes de liquidar.");
    return;
  }
  // Validar que no esté ya liquidado
  var yaLiquidado = (S.config&&S.config.liquidaciones_eeuu||[]).find(function(l){return l.mesKey===mesKey;});
  if(yaLiquidado){
    alert(mesLabelCheck + " ya fue liquidado el " + yaLiquidado.fecha + ".\nNo se puede liquidar dos veces.");
    return;
  }
  var eeuuM  = filterByMes(S.eeuu, mesKey);
  var bruta  = eeuuM.reduce(function(a,r){return a+r.pr;},0);
  var gastos = filterByMes(S.gastos_eeuu||[], mesKey).reduce(function(a,g){return a+(parseFloat(g.monto)||0);},0);
  var neta   = bruta - gastos;
  var paulBruto = neta * 0.5;  // 50% total de Paul antes de deudas
  var deudas = (S.deudas_paul||[]).reduce(function(a,d){return a+(parseFloat(d.monto)||0);},0);
  var paulNeto  = paulBruto - deudas;  // lo que realmente recibe
  var julioNeto = neta * 0.5;          // 50% de Julio
  var partsM = mesKey.split("-");
  var mesLabel = getMesLabel(partsM[1], partsM[0]);

  if(!confirm(
    "💰 LIQUIDACIÓN " + mesLabel.toUpperCase() + "\n\n" +
    "Ganancia bruta EE.UU: $" + f2(bruta) + "\n" +
    "Gastos deducidos: -$" + f2(gastos) + "\n" +
    "Ganancia neta: $" + f2(neta) + "\n\n" +
    "👤 PAUL (50%): $" + f2(paulBruto) + (deudas>0?" − deudas $"+f2(deudas)+" = $"+f2(paulNeto):"") + "\n" +
    "👤 JULIO (50%): $" + f2(julioNeto) + "\n\n" +
    "¿Confirmar liquidación y cerrar " + mesLabel + "?"
  )) return;

  // Guardar registro de liquidación
  if(!S.config) S.config={};
  if(!S.config.liquidaciones_eeuu) S.config.liquidaciones_eeuu=[];
  S.config.liquidaciones_eeuu.push({
    id: Date.now(),
    mesKey:   mesKey,
    mesLabel: mesLabel,
    fecha:    new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit",year:"numeric"}),
    bruta:    bruta,
    gastos:   gastos,
    neta:     neta,
    paulBruto:  paulBruto,
    paulDeudas: deudas,
    paulNeto:   Math.max(0, paulNeto),
    paulArrastre: paulNeto < 0 ? Math.round((-paulNeto)*100)/100 : 0,
    julioNeto:  julioNeto,
    totalOps:   eeuuM.length,
    // Guardar copia de operaciones del mes
    ops: eeuuM
  });

  // Limpiar gastos del mes cerrado
  S.gastos_eeuu = (S.gastos_eeuu||[]).filter(function(g){
    return filterByMes([g], mesKey).length === 0;
  });

  // Manejo de deudas de Paul:
  // - Si paulNeto >= 0, la deuda se saldó por completo este mes → borrar todas.
  // - Si paulNeto < 0, la deuda excedió su ganancia → el sobrante (lo que aún debe)
  //   se arrastra al mes siguiente como una nueva deuda pendiente.
  if(paulNeto >= 0){
    S.deudas_paul = [];
  } else {
    var sobrante = Math.round((-paulNeto)*100)/100; // lo que quedó debiendo
    S.deudas_paul = [{
      id: Date.now(),
      d: new Date().toLocaleDateString("es-ES",{day:"2-digit",month:"2-digit"}),
      desc: "Saldo pendiente de "+mesLabel,
      monto: sobrante
    }];
  }

  // Resetear selector al mes actual (nuevo mes en blanco)
  _opMesSel = getMesKeyActual();
  _dashMes  = getMesKeyActual();

    // Avanzar al siguiente mes en todos los selectores
  var _pts=mesKey.split("-"); var _y=parseInt(_pts[0]),_mo=parseInt(_pts[1]); _mo++; if(_mo>12){_mo=1;_y++;}
  var _nextMes=_y+"-"+String(_mo).padStart(2,"0");
  _opMesSel=_nextMes; _dashMes=_nextMes;
  saveData(); R();
  alert("✅ Liquidación de " + mesLabel + " completada.\nPaul: $" + f2(paulNeto) + " · Julio: $" + f2(julioNeto));
}

function calcTasaUpdate(){
  var tcBrl=parseFloat(document.getElementById("calc-tc-brl")||{value:0}).value||0;
  var tvVes=parseFloat(document.getElementById("calc-tv-ves")||{value:0}).value||0;
  var tcUsd=parseFloat(document.getElementById("calc-tc-usd")||{value:0}).value||0;
  var tcCop=parseFloat(document.getElementById("calc-tc-cop")||{value:0}).value||0;
  // save values
  if(!S.calcTasa) S.calcTasa={};
  if(tcBrl) S.calcTasa.tcBrl=tcBrl;
  if(tvVes) S.calcTasa.tvVes=tvVes;
  if(tcUsd) S.calcTasa.tcUsd=tcUsd;
  if(tcCop) S.calcTasa.tcCop=tcCop;
  var el=document.getElementById("calc-tasa-resultado");
  if(!el) return;
  if(!tcBrl||!tvVes){ el.innerHTML="<div style='color:#aaa;font-size:12px;padding:10px'>Ingresa precio USDT en BRL y VES para ver los cálculos.</div>"; return; }
  var margenes=[6,7,8,9,10,12,15];
  // BRL→VES: tasa_cliente = tcBrl × (1 + %) 
  // es decir: BRL que paga el cliente por cada USD equivalente en VES
  // ganancia = tcBrl_cliente / tcBrl_mercado - 1 = margen
  // tasa_cliente (BS × BRL) = tvVes / tcBrl_cliente
  var rowsBrlVes=margenes.map(function(m){
    var tcCliente=tcBrl*(1+m/100);
    var tasaPublicar=tvVes/tcCliente;
    return "<tr><td style='padding:7px 10px;font-weight:700;color:#0f6e3a'>"+m+"%</td>"+
      "<td style='padding:7px 10px;font-weight:700;font-size:13px'>"+f2(tasaPublicar)+" BS × BRL</td>"+
      "<td style='padding:7px 10px;font-size:11px;color:#888'>Compras a "+f4(tcBrl)+" / Vendes a "+f4(tcCliente)+" BRL/USDT</td></tr>";
  }).join("");
  var rowsVzlaBrl=tvVes>0&&tcBrl>0?margenes.map(function(m){
    var tvClienteVes=tvVes*(1-m/100);
    var tasaPublicar=tvClienteVes/tcBrl;
    return "<tr><td style='padding:7px 10px;font-weight:700;color:#c0392b'>"+m+"%</td>"+
      "<td style='padding:7px 10px;font-weight:700;font-size:13px'>"+f2(tasaPublicar)+" BS × BRL</td>"+
      "<td style='padding:7px 10px;font-size:11px;color:#888'>Cliente da BS a "+f2(tvClienteVes)+" / recibe BRL a "+f4(tcBrl)+"</td></tr>";
  }).join(""):null;
  var rowsUsdVes=tcUsd>0?margenes.map(function(m){
    var tcClienteUsd=tcUsd*(1+m/100);
    var tasaPublicar=tvVes/tcClienteUsd;
    return "<tr><td style='padding:7px 10px;font-weight:700;color:#0a3d7c'>"+m+"%</td>"+
      "<td style='padding:7px 10px;font-weight:700;font-size:13px'>"+f2(tasaPublicar)+" BS × USD</td>"+
      "<td style='padding:7px 10px;font-size:11px;color:#888'>Compras a "+f4(tcUsd)+" / Vendes a "+f4(tcClienteUsd)+" USD/USDT</td></tr>";
  }).join(""):null;
  var rowsCopVes=tcCop>0?margenes.map(function(m){
    var tcClienteCop=tcCop*(1+m/100);
    var tasaPublicar=tvVes/tcClienteCop;
    return "<tr><td style='padding:7px 10px;font-weight:700;color:#7a5c00'>"+m+"%</td>"+
      "<td style='padding:7px 10px;font-weight:700;font-size:13px'>"+f2(tasaPublicar)+" BS × COP</td>"+
      "<td style='padding:7px 10px;font-size:11px;color:#888'>COP a "+f0(tcCop)+" / vendes a "+f0(tcClienteCop)+" COP/USDT</td></tr>";
  }).join(""):null;

  function tabla(title, color, rows){
    return "<div style='margin-bottom:12px'><div style='font-size:11px;font-weight:700;color:"+color+";margin-bottom:6px'>"+title+"</div>"+
      "<table style='width:100%;border-collapse:collapse;font-size:12px;background:#fff;border-radius:8px;overflow:hidden;border:1px solid #eee'>"+
      "<thead><tr style='background:#f9f9f9'><th style='padding:7px 10px;text-align:left;color:#888;font-size:10px'>GANANCIA %</th><th style='padding:7px 10px;text-align:left;color:#888;font-size:10px'>TASA A PUBLICAR</th><th style='padding:7px 10px;text-align:left;color:#888;font-size:10px'>DETALLE</th></tr></thead>"+
      "<tbody>"+rows+"</tbody></table></div>";
  }
  el.innerHTML=
    tabla("🇧🇷→🇻🇪 BRL → Venezuela (BS × 1 BRL)","#0f6e3a",rowsBrlVes)+
    (rowsVzlaBrl?tabla("🇻🇪→🇧🇷 Venezuela → BRL (BS × 1 BRL)","#c0392b",rowsVzlaBrl):"")+
    (rowsUsdVes?tabla("🇺🇸→🇻🇪 USD → Venezuela (BS × 1 USD)","#0a3d7c",rowsUsdVes):"")+
    (rowsCopVes?tabla("🇨🇴→🇻🇪 COP → Venezuela (BS × 1 COP)","#7a5c00",rowsCopVes):"");
}

function cambiarPin(role){
  var inp=document.getElementById("pin-"+role);
  if(!inp) return;
  var val=inp.value.trim();
  if(val.length!==6){alert("La clave debe tener exactamente 6 caracteres (letras, números o símbolos).");return;}
  // Require current admin PIN to change any PIN
  var actual=prompt("Ingresa tu PIN de administrador actual para confirmar el cambio:");
  if(actual!==getEPIN()){alert("PIN de administrador incorrecto.");return;}
  if(!S.config) S.config={};
  if(!S.config.pins) S.config.pins={};
  S.config.pins[role]=val;
  saveData();
  alert("✅ PIN de "+role.toUpperCase()+" cambiado a "+val+" exitosamente.");
  inp.value="";
  R();
}

function saveData(){
  try{
    var obj={_ts:Date.now()};
    // Count total ops for integrity check
    obj._opsCount=(S.brl||[]).length+(S.vzla||[]).length+(S.eeuu||[]).length;
    DATA_KEYS.forEach(function(k){ obj[k]=S[k]; });
    var json=JSON.stringify(obj);
    localStorage.setItem(STORAGE_KEY, json);
    localStorage.setItem(STORAGE_KEY+"_bak", json);
    fbSave(obj);
  }catch(e){ console.warn("saveData error:",e); }
}
function loadData(){
  var raw=localStorage.getItem(STORAGE_KEY)||localStorage.getItem(STORAGE_KEY+"_bak");
  if(!raw) return 0;
  try{
    var saved=JSON.parse(raw);
    var loaded=0;
    DATA_KEYS.forEach(function(k){
      if(saved[k]!==undefined){S[k]=saved[k];loaded+=Array.isArray(saved[k])?saved[k].length:1;}
    });
    return loaded;
  }catch(e){console.warn("loadData error:",e);return 0;}
}
function exportData(){
  try{
    var obj={_version:1,_exportado:new Date().toLocaleString("es-ES")};
    DATA_KEYS.forEach(function(k){obj[k]=S[k];});
    var blob=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    var d=new Date();
    a.download="RemesasBRL_"+d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")+".json";
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    alert("✅ Datos exportados.\n\nGuarda este .json para importarlo en versiones futuras.");
  }catch(e){alert("Error: "+e.message);}
}
function importData(){
  var input=document.createElement("input");
  input.type="file";input.accept=".json";
  input.onchange=function(ev){
    var file=ev.target.files[0];if(!file)return;
    var reader=new FileReader();
    reader.onload=function(e){
      try{
        var obj=JSON.parse(e.target.result);
        var loaded=0;
        DATA_KEYS.forEach(function(k){
          if(obj[k]!==undefined){S[k]=obj[k];loaded+=Array.isArray(obj[k])?obj[k].length:1;}
        });
        saveData();R();
        alert("✅ Datos importados: "+loaded+" registros restaurados.");
      }catch(ex){alert("Error al importar: "+ex.message);}
    };
    reader.readAsText(file);
  };
  document.body.appendChild(input);input.click();document.body.removeChild(input);
}

// Revierte los saldos de cuentas cuando se elimina una remesa
function revertirSaldosRemesa(tipo, r){
  var am=parseFloat(r.am)||0;
  var tv=parseFloat(r.tv)||0;
  var tc=parseFloat(r.tc)||0;
  var cant=parseFloat(r.cant)||0;

  function adj(id, delta, moneda){
    if(!delta) return;
    var c=null;
    if(id) c=(S.cuentas||[]).find(function(x){return x.id===id;});
    if(!c && moneda) c=(S.cuentas||[]).find(function(x){return x.activa!==false&&x.moneda===moneda;});
    if(c) c.saldo=Math.round(((parseFloat(c.saldo)||0)+(parseFloat(delta)||0))*100)/100;
  }

  if(tipo==="brl"){
    // BRL→VES: se había sumado BRL a cuentaBanco, descontar
    adj(r.cuentaBanco||null, -am, "BRL");
    // Si había cuenta VES destino, se había restado cant, devolver
    if(r.cuentaDest) adj(r.cuentaDest, +cant, "VES");

  } else if(tipo==="vzla"){
    // VZLA→BRL: se había restado BRL, devolver
    adj(r.cuentaBanco||null, +am, "BRL");

  } else if(tipo==="eeuu"){
    // EE.UU→VES: se había sumado USD a cuentaBanco, descontar
    adj(r.cuentaBanco||null, -am, "USD");
    // Si había cuenta VES destino, se había restado cant, devolver
    if(r.cuentaDest) adj(r.cuentaDest, +cant, "VES");
  }
}

// Revierte saldos cuando se elimina un movimiento de inventario USDT
function revertirSaldosInventario(r){
  var usdt=parseFloat(r.usdt)||0;
  var mo=parseFloat(r.montOrigen)||0;
  var bs=parseFloat(r.bs)||0;

  function adjId(id, delta){
    if(!id||!delta) return;
    var c=(S.cuentas||[]).find(function(x){return x.id===id;});
    if(c) c.saldo=Math.round(((parseFloat(c.saldo)||0)+(parseFloat(delta)||0))*100)/100;
  }

  if(r.tipo==="compra"){
    // Compra: USDT había subido → restar; BRL/USD había bajado → devolver
    adjId(r.cuentaId, -usdt);            // USDT baja
    adjId(r.cuentaOrigenId, +mo);        // BRL/USD devuelve
  } else {
    // Venta: USDT había bajado → devolver; VES había subido → restar
    adjId(r.cuentaId, +usdt);            // USDT devuelve
    adjId(r.cuentaDestinoId, -bs);       // VES baja
  }
  // Limpiar manual_override para que sincronizarSaldosUsdt recalcule
  (S.cuentas||[]).forEach(function(c){if(c.moneda==="USDT") c.manual_override=false;});
  sincronizarSaldosUsdt();
}

// Revierte saldos cuando se elimina un traspaso
function revertirSaldosTraspaso(t){
  var monto=parseFloat(t.monto)||0;
  function adjId(id, delta){
    if(!id||!delta) return;
    var c=(S.cuentas||[]).find(function(x){return x.id===id;});
    if(c) c.saldo=Math.round(((parseFloat(c.saldo)||0)+(parseFloat(delta)||0))*100)/100;
  }
  // Traspaso había restado de origen y sumado a destino → invertir
  adjId(t.cuentaOrigen||t.origen, +monto);
  adjId(t.cuentaDestino||t.destino, -monto);
}

// ── SINCRONIZACIÓN AUTOMÁTICA INVENTARIO → CUENTAS ──────────────────
// Calcula el saldo USDT de cada cuenta desde sus movimientos en inventario
// y actualiza S.cuentas automáticamente (a menos que tenga override manual)
function sincronizarSaldosUsdt(){
  if(!S.cuentas||!S.inventarioUsdt) return;

  // Agrupar movimientos por cuentaId
  var saldosPorCuenta = {};
  S.inventarioUsdt.forEach(function(r){
    var cid = r.cuentaId||"";
    if(!cid) return;
    if(!saldosPorCuenta[cid]) saldosPorCuenta[cid] = 0;
    if(r.tipo==="compra")  saldosPorCuenta[cid] += parseFloat(r.usdt)||0;
    else                    saldosPorCuenta[cid] -= parseFloat(r.usdt)||0;
  });

  // Actualizar S.cuentas con los saldos calculados
  S.cuentas.forEach(function(c){
    if(c.moneda !== "USDT") return;
    if(c.manual_override)  return; // respeta edición manual
    if(saldosPorCuenta[c.id] !== undefined){
      c.saldo = Math.round(saldosPorCuenta[c.id]*100)/100;
    }
  });
}

function getInventarioStats(){
  var inv=S.inventarioUsdt;
  var compras=inv.filter(function(r){return r.tipo==="compra";});
  var ventas=inv.filter(function(r){return r.tipo==="venta";});
  var totalComp=compras.reduce(function(a,r){return a+(parseFloat(r.usdt)||0);},0);
  var totalVend=ventas.reduce(function(a,r){return a+(parseFloat(r.usdt)||0);},0);
  var totalBsRec=ventas.reduce(function(a,r){return a+(parseFloat(r.bs)||0);},0);
  var sugTasaVenta=parseFloat(getLastTasaVenta("VES"))||0; // FIFO: venta más vieja con bolívares disponibles

  // USDT DISPONIBLE REAL: suma saldos reales de cuentas USDT en S.cuentas
  var usdtReal=(S.cuentas||[])
    .filter(function(c){return c.moneda==="USDT"&&c.activa!==false;})
    .reduce(function(a,c){return a+(parseFloat(c.saldo)||0);},0);
  usdtReal=Math.round(usdtReal*10000)/10000;

  // BS DISPONIBLE REAL: suma saldos reales de cuentas VES en S.cuentas
  var bsReal=(S.cuentas||[])
    .filter(function(c){return c.moneda==="VES"&&c.activa!==false;})
    .reduce(function(a,c){return a+(parseFloat(c.saldo)||0);},0);
  bsReal=Math.round(bsReal*100)/100;

  // BRL DISPONIBLE REAL: suma saldos reales de cuentas BRL
  var brlReal=(S.cuentas||[])
    .filter(function(c){return c.moneda==="BRL"&&c.activa!==false;})
    .reduce(function(a,c){return a+(parseFloat(c.saldo)||0);},0);
  brlReal=Math.round(brlReal*100)/100;

  return{totalComp:totalComp,totalVend:totalVend,
    disponible:usdtReal,        // REAL desde S.cuentas USDT
    totalBsRec:bsReal,          // REAL desde S.cuentas VES
    totalBrlReal:brlReal,       // REAL desde S.cuentas BRL
    sugTasaVenta:sugTasaVenta,compras:compras,ventas:ventas};
}
function getSugVentaRate(){var t=getLastTasaVenta("VES");return t!==null?t:getInventarioStats().sugTasaVenta;}
// ── FIFO: normaliza campos de lotes (restante en compras, bsRestante en ventas) ──
function normalizarInventarioFIFO(){
  (S.inventarioUsdt||[]).forEach(function(r){
    if(r.tipo==="compra"){
      if(r.restante===undefined||r.restante===null) r.restante=parseFloat(r.usdt)||0;
    }else{
      if(r.bsRestante===undefined||r.bsRestante===null) r.bsRestante=parseFloat(r.bs)||0;
    }
  });
}
// Orden cronológico ascendente (fecha MM/DD, luego id) — la más vieja primero
function ordenFIFO(a,b){
  function v(f){if(!f)return 0;var p=String(f).split("/");return (parseInt(p[0],10)||0)*100+(parseInt(p[1],10)||0);}
  return (v(a.fecha)-v(b.fecha))||((a.id||0)-(b.id||0));
}
// TC: tasa de la compra MÁS VIEJA con USDT restante (FIFO), sin importar plataforma/operador
function getLastTasaCompra(moneda){
  normalizarInventarioFIFO();
  var arr=S.inventarioUsdt.filter(function(r){return r.tipo==="compra"&&r.moneda===(moneda||"BRL");}).sort(ordenFIFO);
  if(!arr.length) return null;
  for(var i=0;i<arr.length;i++){
    if((parseFloat(arr[i].restante)||0)>0.01) return arr[i].tasa;
  }
  return arr[arr.length-1].tasa; // todo consumido → última como referencia
}
// TV: tasa de la venta MÁS VIEJA con bolívares disponibles (FIFO), sin importar plataforma/operador
function getLastTasaVenta(monedaDest){
  normalizarInventarioFIFO();
  var dest=monedaDest||"VES";
  var arr=S.inventarioUsdt.filter(function(r){return r.tipo==="venta"&&r.moneda===dest;}).sort(ordenFIFO);
  if(!arr.length){
    var todas=S.inventarioUsdt.filter(function(r){return r.tipo==="venta";}).sort(ordenFIFO);
    if(!todas.length) return null;
    for(var j=0;j<todas.length;j++){
      if((parseFloat(todas[j].bsRestante)||0)>0.01) return todas[j].tasa;
    }
    return todas[todas.length-1].tasa;
  }
  for(var i=0;i<arr.length;i++){
    if((parseFloat(arr[i].bsRestante)||0)>0.01) return arr[i].tasa;
  }
  return arr[arr.length-1].tasa; // todo consumido → última como referencia
}
// Consume FIFO los lotes al registrar una remesa:
//  - compras: descuenta 'usdtUsados' del USDT restante (lote más viejo primero)
//  - ventas:  descuenta 'bsEntregados' de los bolívares disponibles (lote más viejo primero)
function consumirInventarioFIFO(monedaOrig, usdtUsados, monedaDest, bsEntregados){
  normalizarInventarioFIFO();
  var u=parseFloat(usdtUsados)||0;
  if(u>0){
    var compras=S.inventarioUsdt.filter(function(r){return r.tipo==="compra"&&r.moneda===monedaOrig;}).sort(ordenFIFO);
    for(var i=0;i<compras.length&&u>0.0001;i++){
      var disp=parseFloat(compras[i].restante)||0;
      if(disp<=0) continue;
      var usar=Math.min(disp,u);
      compras[i].restante=Math.round((disp-usar)*10000)/10000;
      u-=usar;
    }
  }
  var b=parseFloat(bsEntregados)||0;
  if(b>0){
    var ventas=S.inventarioUsdt.filter(function(r){return r.tipo==="venta"&&r.moneda===(monedaDest||"VES");}).sort(ordenFIFO);
    for(var k=0;k<ventas.length&&b>0.01;k++){
      var dispB=parseFloat(ventas[k].bsRestante)||0;
      if(dispB<=0) continue;
      var usarB=Math.min(dispB,b);
      ventas[k].bsRestante=Math.round((dispB-usarB)*100)/100;
      b-=usarB;
    }
  }
}
// Ajuste manual del restante de un lote (ej: bolívares ya gastados antes de esta versión)
function editRestanteInv(id){
  var r=(S.inventarioUsdt||[]).find(function(x){return x.id===id;});
  if(!r) return;
  normalizarInventarioFIFO();
  var esCompra=r.tipo==="compra";
  var actual=esCompra?(parseFloat(r.restante)||0):(parseFloat(r.bsRestante)||0);
  var max=esCompra?(parseFloat(r.usdt)||0):(parseFloat(r.bs)||0);
  var v=prompt((esCompra?"USDT restantes de este lote (máx "+f4(max)+"):":"Bolívares disponibles de esta venta (máx "+f2(max)+"):"),String(actual));
  if(v===null) return;
  v=parseFloat(String(v).replace(/\./g,"").replace(",","."));
  if(isNaN(v)){v=parseFloat(prompt("Valor no válido. Ingresa solo números (usa punto decimal):","")||"");}

function toUsdt(amount,moneda){

function marcarCobrado(id){
  var pin=prompt("PIN de administrador:");
  if(pin===null) return;
  var adminPin=S.config&&S.config.pins?S.config.pins.admin:"1234";
  if(pin!==adminPin){alert("PIN incorrecto.");return;}
  var idx=S.cuentasCobrar.findIndex(function(c){return c.id===id;});
  if(idx===-1) return;
  var hoy=new Date();
  var dd=String(hoy.getDate()).padStart(2,"0");
  var mm=String(hoy.getMonth()+1).padStart(2,"0");
  S.cuentasCobrar[idx].estado="cobrado";
  S.cuentasCobrar[idx].fechaCobro=dd+"/"+mm+"/"+hoy.getFullYear();
  saveData();R();
}

// ── UTILIDAD: obtener mes/año de un registro ────────────
function getMesAnio(d){
  // d = "dd/mm" → current year, or "dd/mm/yy" or "01/05/2026" etc
  if(!d) return {mes:"",anio:""};
  var parts=d.split("/");
  if(parts.length>=3){
    var anio=parts[2].length===2?"20"+parts[2]:parts[2];
    return{mes:parts[1],anio:anio};
  }
  // "dd/mm" — assume current year
  var now=new Date();
  return{mes:parts[1]||"",anio:String(now.getFullYear())};
}

function getMesLabel(mes,anio){
  var meses=["","Enero","Febrero","Marzo","Abril","Mayo","Junio",
             "Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  return (meses[parseInt(mes)]||mes)+" "+anio;
}

// Build list of unique months from all operations
function getMesesDisponibles(){
  var all=[].concat(S.brl,S.vzla,S.eeuu,S.egresos);
  var set={};
  all.forEach(function(r){
    var m=getMesAnio(r.d);
    if(m.mes){
      var mesN=String(parseInt(m.mes)).padStart(2,"0");
      var key=m.anio+"-"+mesN;
      set[key]={mes:mesN,anio:m.anio,key:key};
    }
  });
  return Object.values(set).sort(function(a,b){
    return (b.anio+b.mes).localeCompare(a.anio+a.mes);
  });
}

function filterByMes(arr, mesKey){
  if(!mesKey) return arr;
  var parts=mesKey.split("-");
  var wantAnio=parts[0];
  var wantMes=String(parseInt(parts[1]||"0")).padStart(2,"0");
  return arr.filter(function(r){
    var m=getMesAnio(r.d);
    var rMes=String(parseInt(m.mes||"0")).padStart(2,"0");
    return m.anio===wantAnio && rMes===wantMes;
  });
}

// FIREBASE — Sincronización en tiempo real
// ══════════════════════════════════════════════════════
var _FB_CONFIG = {
  apiKey: "AIzaSyASfVfzHVDfSkvp2Ws978CQP7DisQld5Bc",
  authDomain: "adminbrl.firebaseapp.com",
  databaseURL: "https://adminbrl-default-rtdb.firebaseio.com",
  projectId: "adminbrl",
  storageBucket: "adminbrl.firebasestorage.app",
  messagingSenderId: "646124622933",
  appId: "1:646124622933:web:3f60d6c160624894f8b0dc"
};

var _fbDb = null, _fbRef = null, _fbSaveTimer = null;
var _fbMyWrite = false;   // evita que mi propio guardado rebote
var _fbOnline = false;

function initFirebase(){
  try{
    if(!firebase||!firebase.initializeApp) return;
    firebase.initializeApp(_FB_CONFIG);
    _fbDb  = firebase.database();
    _fbRef = _fbDb.ref("remesasBRL_v1");

    // Indicador de conexión en topbar
    _fbDb.ref(".info/connected").on("value", function(snap){
      _fbOnline = snap.val()===true;
      var dot = document.getElementById("fb-dot");
      // Solo actualizar color si no hay badge pendiente
      var badge=document.getElementById("sync-badge");
      if(dot && !badge) dot.style.background = _fbOnline ? "#4ade80" : "#f87171";
    });

    // Listener en tiempo real: cuando OTRO usuario guarda, actualizamos
    _fbRef.on("value", function(snap){
      // Si YO acabo de guardar, ignoro el rebote
      if(_fbMyWrite){ _fbMyWrite=false; return; }
      var data = snap.val();
      if(!data) return;
      var tsRemoto = data._ts || 0;
      var tsLocal  = S._ts || 0;
      // Solo actualiza si los datos remotos son MÁS NUEVOS
      if(tsRemoto > 0 && tsRemoto <= tsLocal) return;
      // Protección: no aplicar si Firebase tiene MENOS operaciones que local
      var fbOps=(data.brl||[]).length+(data.vzla||[]).length+(data.eeuu||[]).length;
      var localOps=S.brl.length+S.vzla.length+S.eeuu.length;
      if(fbOps > 0 && fbOps < localOps - 5){
        console.warn("⚠️ Firebase tiene menos ops ("+fbOps+") que local ("+localOps+") — ignorando para proteger datos");
        return;
      }
      // Comparar Firebase vs localStorage — ganar el que tenga MÁS datos
      var fbBrl=(data.brl||[]).length, fbVzla=(data.vzla||[]).length, fbEeuu=(data.eeuu||[]).length;
      var lsBrl=S.brl.length, lsVzla=S.vzla.length, lsEeuu=S.eeuu.length;
      var fbTotal=fbBrl+fbVzla+fbEeuu;
      var lsTotal=lsBrl+lsVzla+lsEeuu;

      if(fbTotal >= lsTotal){
        // Firebase tiene igual o más datos → usar Firebase
        DATA_KEYS.forEach(function(k){ if(data[k]!==undefined) S[k]=data[k]; });
        S._ts = tsRemoto;
        _syncCapitalWithCuentas();
      } else {
        // localStorage tiene MÁS datos → fusionar: añadir lo que falte de Firebase a localStorage
        // (preserva entradas locales nuevas que aún no llegaron a Firebase)
        DATA_KEYS.forEach(function(k){
          if(data[k]===undefined) return;
          if(k==="brl"||k==="vzla"||k==="eeuu"){
            // Merge ambas fuentes
            var localArr=S[k]||[];
            var fbArr=data[k]||[];
            var localIds=localArr.map(function(r){return r.d+"|"+(r.id||r.cl)+"|"+r.am;});
            var toAdd=fbArr.filter(function(r){return localIds.indexOf(r.d+"|"+(r.id||r.cl)+"|"+r.am)===-1;});
            if(toAdd.length>0){
              S[k]=localArr.concat(toAdd);
              S[k].sort(function(a,b){var da=a.d.split("/"),db=b.d.split("/");return (parseInt(da[1])*100+parseInt(da[0]))-(parseInt(db[1])*100+parseInt(db[0]));});
              S[k].forEach(function(r,i){r.n=i+1;});
            }
          } else {
            if(data[k]!==undefined) S[k]=data[k];
          }
        });
        // Save merged result back to Firebase
        saveData();
      }

      // Merge base data on top (nunca quita datos nuevos, solo agrega faltantes)
      mergeBaseClients();
      mergeBaseOps();

      localStorage.setItem(STORAGE_KEY, JSON.stringify(S));
      // Sync silencioso — NUNCA re-renderiza automáticamente (evita parpadeo)
      // Solo muestra badge de notificación, el usuario decide cuándo actualizar
      if(S.role){
        _showSyncBadge();
      }
      console.log("🔄 Sync desde Firebase · ts:", tsRemoto);
    }, function(err){
      console.warn("Firebase listener error:", err.code, err.message);
    });

    console.log("✅ Firebase conectado");
  }catch(e){
    console.warn("Firebase init error:", e);
  }
}

// Guarda en Firebase con debounce de 1 segundo (evita escrituras excesivas)
function fbSave(obj){
  if(!_fbRef) return;
  if(_fbSaveTimer) clearTimeout(_fbSaveTimer);
  _fbSaveTimer = setTimeout(function(){
    _fbMyWrite = true;
    S._ts = obj._ts; // actualizar timestamp local para comparaciones futuras
    _fbRef.set(obj).then(function(){
      console.log("💾 Firebase guardado · ts:", obj._ts);
    }).catch(function(e){
      console.warn("Firebase save error:", e);
      _fbMyWrite = false; // si falla, permitir que el listener funcione
    });
  }, 800);
}

// 1. Load localStorage for immediate display (no Firebase write)

// 2. Merge ONLY clients from base data (non-destructive, no ops)
function mergeBaseClients(){
  if(_EEUU_CLIENTS && _EEUU_CLIENTS.length > 0){
    var _exN=S.clientes.filter(function(cl){return cl.nota==="EEUU";}).map(function(cl){return cl.n;});
    var _add=_EEUU_CLIENTS.filter(function(cl){return _exN.indexOf(cl.n)===-1;});
    if(_add.length>0) S.clientes=S.clientes.concat(_add);
  }
}
mergeBaseClients();

// 3. SAFE merge: add Excel base ops ONLY if they're missing (never overwrite newer data)
function mergeBaseOps(){
  // BRL
  if(_BRL_EXCEL){
    var bIds=S.brl.map(function(r){return r.d+"|"+r.id+"|"+r.am;});
    var bAdd=_BRL_EXCEL.filter(function(r){return bIds.indexOf(r.d+"|"+r.id+"|"+r.am)===-1;});
    if(bAdd.length>0){
      S.brl=S.brl.concat(bAdd);
      S.brl.sort(function(a,b){var da=a.d.split("/"),db=b.d.split("/");var ka=parseInt(da[1])*100+parseInt(da[0]);var kb=parseInt(db[1])*100+parseInt(db[0]);return ka-kb;});
      S.brl.forEach(function(r,i){r.n=i+1;});
    }
  }
  // VZLA
  if(_VZLA_EXCEL){
    var vIds=S.vzla.map(function(r){return r.d+"|"+r.id+"|"+r.am;});
    var vAdd=_VZLA_EXCEL.filter(function(r){return vIds.indexOf(r.d+"|"+r.id+"|"+r.am)===-1;});
    if(vAdd.length>0){
      S.vzla=S.vzla.concat(vAdd);
      S.vzla.sort(function(a,b){var da=a.d.split("/"),db=b.d.split("/");var ka=parseInt(da[1])*100+parseInt(da[0]);var kb=parseInt(db[1])*100+parseInt(db[0]);return ka-kb;});
      S.vzla.forEach(function(r,i){r.n=i+1;});
    }
  }
  // EE.UU
  if(_EEUU_EXCEL){
    var eIds=S.eeuu.map(function(r){return r.d+"|"+r.cl+"|"+r.am;});
    var eAdd=_EEUU_EXCEL.filter(function(r){return eIds.indexOf(r.d+"|"+r.cl+"|"+r.am)===-1;});
    if(eAdd.length>0){
      S.eeuu=S.eeuu.concat(eAdd);
      S.eeuu.sort(function(a,b){var da=a.d.split("/"),db=b.d.split("/");var ka=parseInt(da[1])*100+parseInt(da[0]);var kb=parseInt(db[1])*100+parseInt(db[0]);return ka-kb;});
      S.eeuu.forEach(function(r,i){r.n=i+1;});
    }
  }
}
mergeBaseOps();

// 4. Init Firebase — Firebase es la fuente de verdad
//    NO escribimos a Firebase en startup para no borrar datos nuevos
//    Firebase listener cargará los datos y luego hará el merge de base encima
(function tryInitFirebase(attempt){
  if(typeof firebase !== "undefined"){
    initFirebase();
  } else if(attempt < 20){
    setTimeout(function(){ tryInitFirebase(attempt+1); }, 250);
  } else {
    console.warn("Firebase SDK no disponible después de 5s — funcionando sin sync");
  }
})(0);

// ── Global uppercase enforcement ────────────────────────────────────────
document.addEventListener("input", function(e){
  var el = e.target;
  if(el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return;
  var t = el.type || "text";
  if(t === "number" || t === "date" || t === "password" || t === "email") return;
  // Preserve cursor position
  var start = el.selectionStart, end = el.selectionEnd;
  el.value = el.value.toUpperCase();
  try{ el.setSelectionRange(start, end); }catch(e){}
}, true);

// Handle paste events (converts pasted text to uppercase)
document.addEventListener("paste", function(e){
  var el = e.target;
  if(el.tagName !== "INPUT" && el.tagName !== "TEXTAREA") return;
  var t = el.type || "text";
  if(t === "number" || t === "date" || t === "password" || t === "email") return;
  setTimeout(function(){
    var start = el.selectionStart, end = el.selectionEnd;
    el.value = el.value.toUpperCase();
    try{ el.setSelectionRange(start, end); }catch(e){}
  }, 0);
}, true);

// Global click delegation for data-tab and data-role
document.addEventListener('click', function(ev){
  var el=ev.target;
  for(var i=0;i<4;i++){
    if(!el||!el.getAttribute) break;
    var tab=el.getAttribute('data-tab');
    if(tab){st(tab);return;}
    var role=el.getAttribute('data-role');
    if(role){showPinLogin(role);return;}
    el=el.parentElement;
  }
}, true);
