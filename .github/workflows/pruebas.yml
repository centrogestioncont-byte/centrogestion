# Revision automatica en cada Pull Request.
#
# Corre antes de que nada se mezcle con "test" o con "main", asi un archivo
# truncado, un error de sintaxis o una funcion perdida se ven en el PR y no
# en produccion.
name: Pruebas

on:
  pull_request:
    branches: [test, main]
  push:
    branches: [test, main]

jobs:
  revisar:
    name: Revisar index.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Hace falta el historial para comparar con la rama base: la guardia
          # de version mira si index.html cambia sin que cambie APP_VERSION.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Revisar
        run: python3 pruebas/revisar.py

      - name: Probar la logica de prestamos
        run: node pruebas/prestamos.js

      # ARREGLO 82: si index.html cambia y APP_VERSION no, el aviso de "hay una
      # version nueva" no sale y el aparato se queda con la copia en cache. Paso
      # 126 commits seguidos: un arreglo desplegado en produccion no le llegaba.
      - name: Revisar que la version suba con el archivo
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --force origin \
            "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
          python3 pruebas/version.py "origin/${{ github.base_ref }}"
